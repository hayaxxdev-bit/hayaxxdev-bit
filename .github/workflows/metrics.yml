name: 🛡️ Update Status Window

on:
  schedule:
    - cron: "0 */6 * * *"   # refresh tiap 6 jam
  workflow_dispatch:         # bisa trigger manual dari tab Actions
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: hayaxxdev-bit
          filename: github-metrics.svg
          template: classic
          base: "header, activity, community, repositories, metadata"

          # === Tema emas/hitam biar senada dengan README ===
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%

          # === Quest Log otomatis: ambil repo terbaru yg di-update ===
          plugin_repositories: yes
          plugin_repositories_featured: Nexovra, StoImpo, WorkNote, hayaxxdev-bit.github.io

          # === Aktivitas terbaru (commit/PR/issue) ===
          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_days: 14