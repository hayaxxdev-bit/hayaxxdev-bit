name: Update Anime Countdown

on:
  schedule:
    - cron: "*/30 * * * *"   # tiap 30 menit
  workflow_dispatch: {}       # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]
    paths:
      - "anime_config.json"

jobs:
  update-countdown:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate countdown card
        run: python scripts/update_anime_countdown.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md assets/anime-countdown.svg
          git diff --staged --quiet || git commit -m "chore: update anime countdown [skip ci]"
          git push
