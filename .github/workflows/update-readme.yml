name: Update README Repositories

on:
  schedule:
    - cron: "0 0 * * *"   # tiap hari jam 00:00 UTC (07:00 WIB)
  workflow_dispatch: {}    # bisa dijalankan manual dari tab Actions
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Update repo table in README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: hayaxxdev-bit
        run: python scripts/update_readme_repos.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update repository list [skip ci]"
          git push